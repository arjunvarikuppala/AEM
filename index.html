<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aadhya Earthmovers</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            background-color: #000000;
            border-bottom: 1px solid #111;
            padding: 1rem 2.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .left-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* The yellow square logo based on the image */
        .css-logo {
            background-color: #ffb800; /* Yellow matching the image */
            color: #000000;
            width: 48px;
            height: 48px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: -0.5px;
            user-select: none;
        }

        .brand-text {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #ffffff;
        }

        .right-section {
            display: flex;
            align-items: center;
            gap: 2.5rem;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.8rem;
        }

        .nav-links a {
            color: #d0d0d0;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #ffb800;
        }

        .quote-btn {
            background-color: #ffb800;
            color: #000000;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 0.6rem 1.4rem;
            border-radius: 4px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .quote-btn:hover {
            background-color: #e6a600;
            transform: translateY(-1px);
        }

        .hero {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 80px);
            background: radial-gradient(circle at center, #151515 0%, #050505 100%);
            padding: 2rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            color: #222; /* very subtle */
        }
    </style>
</head>
<body>
    <header>
        <div class="left-section">
            <div class="css-logo">AEM</div>
            <div class="brand-text">AADHYA EARTH MOVERS</div>
        </div>
        
        <div class="right-section">
            <nav class="nav-links">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Equipment</a>
                <a href="#">Projects</a>
                <a href="#">Gallery</a>
                <a href="#">Contact</a>
            </nav>
            <a href="#" class="quote-btn">Get Quote</a>
        </div>
    </header>

    <main class="hero">
        <h1>Building the Future</h1>
    </main>
</body>
</html>
